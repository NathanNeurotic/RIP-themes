# ======================================================================================================
# Theme Name: Korium
# Made by: Berion (graphics), KrahJohlito and Ripto (theme script: Korium Komblete); built-in port by RiptOPL
# Created: Korium Komblete (its date is not recorded in RiptOPL)
# Updated: 11/10/2026 (this external port)
# Files: conf_theme.cfg, CREDITS.txt and the Korium edition's images, each named as the engine looks it up
#   (background.png, background_info.png, case.png, apps_case.png, case_ps1.png, disc_ps1.png...).
#   coverapp.png is Korium's cover.png: Korium has no app placeholder of its own, as in RiptOPL.
# Ported: 11/10/2026 by NathanNeurotic (Ripto) from RiptOPL's built-in look, RiptOPL rebuild/main d74f504
#   (github.com/NathanNeurotic/RiptOPL), for RIPPS2. Layout kept element for element as RiptOPL embeds it.
# Colours: none set here, as in RiptOPL: the user's Colours settings colour the theme.
# Fonts: none shipped. RiptOPL draws these with its built-in POE Vetica New, a commercial face that is not
#   ours to hand out, so here they use RIPPS2's own default face. That is the one visible difference.
# Credits and licence: CREDITS.txt in this folder.
# ======================================================================================================
#
# ======================================================================================================
# KEY GLOSSARY: every key a RIPPS2 theme can use, as of RIPPS2 build 115 (10/26/2026).
# Full detail: docs/THEME_KEYS.md (RIPPS2's keys) and docs/THEME_ENGINE_RiptOPL.md (the engine under it),
# github.com/akilluminati47/RIPPS2-themes. Lines starting with # are comments: the engine skips them.
# A key the engine does not know is ignored, silently. "B" is the RIPPS2 build a key arrived in (OPL =
# from OPL / RiptOPL); an older build ignores a newer key, so a theme stays usable on it.
# ======================================================================================================
#
# ---- FILE LAYOUT -------------------------------------------------------------------------------------
#   key=value        a global key: no indent, above the first element block
#   main0:           an element block; its keys follow, one per line, indented with a tab
#   Families: main / info (the game list / its info page), appsMain / appsInfo, favsMain / favsInfo,
#   vcdMain / vcdInfo, favsVcdMain / favsVcdInfo, favsAppsMain / favsAppsInfo. main and info count 0, 1,
#   2... with no gap (the engine stops at the first missing number); every other family replaces its
#   base family's element of the same number. Elements draw in the order they are declared.
# ---- COORDINATES -------------------------------------------------------------------------------------
#   A 640 x 480 space, scaled to the video mode (480p, 720p and 1080i included). Negative x / y count
#   from the right / bottom. POS_MID: the centre. DIM_INF: the whole width or height.
#
# ---- GLOBAL KEYS -------------------------------------------- B ---- values: what it does -------------
#   bg_color                                                   OPL    #RRGGBB: the page behind everything
#   text_color / ui_text_color / sel_text_color / title_color  OPL    #RRGGBB: text, menu text, the
#                                                                     selection (the Grid's glow too), titles
#   default_font, font1 ... font15                             OPL/59 a .ttf in the folder, or builtin:
#   default_font_size, font1_size ... font15_size              OPL    pixels
#   font1_caps ... font15_caps (default_font_caps)             70     1: that font in capitals
#   font1_weight ... font15_weight (default_font_weight)       114    100..900: the weight it is drawn at; builtin:roboto
#                                                                     is variable (400..700), any other face is grown
#   row_font, notice_font        115    a slot (0..15) for STATUS's and ACHIEVEMENTS' option names, and for every
#                                       notification (unset: Settings' Roboto rows, and the built-in Roboto
#                                       Condensed Bold)
#   message_font                 115    a slot (0..15) for every message box and wait screen (unset: the built-in
#                                       Roboto Condensed at 400 in its own case, whatever Text Weight says)
#   the built-in fonts (builtin:<name>, nothing to ship)       114    ripps2 (Planet N Compact), ripps2sleek,
#                                                                     ripps2sleekbold, ripps2sleekcase, roboto (Roboto
#                                                                     Condensed 3.015, variable), ripflow (it at 400),
#                                                                     ripflowbold (it at 700); 115: ripps2condensed
#                                                                     (Planet N Condensed, Adapt's face)
#   towers                                                     78     0: no pillars on the game pages
#   bg_blur                                                    98     off weak normal strong: how hard
#                                                                     frosted glass blurs the art (strong)
#   use_settings_bg                                            OPL    1 + settings_bg.png: Settings over it
#   use_default                                                OPL    0: no fallback to RIPPS2's own images
#   badge_set                                                  115    theme (default), ripps2: RIPPS2's own badges
#                                                                     (RIPFLOW's, Players and ESRB added) on the info
#                                                                     page, no badge folders to ship
#   loading_mark                                               115    corner (544, 426), center (320, 426): where
#                                                                     RIPPS2's busy mark sits (unset: the LoadingIcon
#                                                                     element's place); load0..7 are not drawn
#   use_real_height                                            OPL    1: lay out against the real height
#   coverflow_cover_offset                                     OPL    -1024..1024: Coverflow's nudge
#
# ---- COLORS AND MORE, THE THEME'S DEFAULTS (the user's own choice always wins) ------------------------
#   color_theme       81  ripps2 ember blood ectoplasm amethyst bone (114: tangerine flamingo turquoise
#                         moonlight): one colour matrix over RIPPS2's own
#   category_bar      81  shown fade hidden: LAUNCH DISC / STORAGE / MEMORY FILES along the top
#   button_hints      81  shown fade hidden: the hint row
#   dpad_glyphs       81  hidden shown fade_in fade_out guidance: the D-pad glyphs beside a drive's name
#                         (115: guidance, in after 4.2 s with no press; on RIPFLOW in sidebar mode, L1/R1 too)
#   category_order    81  launch_disc_first memory_files_first
#   source_name       80  pop shown fade hidden: the source's name (pop: a toast in big capitals)
#   source_name_sidebar 136 pop pop_name: the same while the sidebar is on
#   page_buttons      96  l2r2 l1r1: which shoulder pair turns the list's pages (the other switches tabs)
#
# ---- HINTS AND GLYPHS (90) ---------------------------------------------------------------------------
#   hints_hide        hint names, comma separated: left off the bar (the buttons still work)
#   hints_order       hint names, comma separated: these first, in this order
#   hints_labels      1 (default), 0 (glyphs only), badge (glyph and title on one pill, hint_badge.png)
#   hints_layout      row (default), column (one hint a line from the hint element's x / y down)
#   hints_spacing     12..96 (28): a column's line pitch
#   glyph_set         theme (the folder's PNGs), ripps2, standard, white
#   hints_fade        115: 1 (default), 0: a hint glyph that changes fades in as the covers do
#   hints_flank       115: 1: OSDSYS style, the confirm button's RUN left of the source name (a centred MenuText)
#                     and the cancel button's SOURCE right of it, out of the hint row; hints_flank_gap the room
#                     between name and hint (18). RIPFLOW sets it
#   Hint names: menu run info options refresh star view source (or by button: start select r3 l3 cross
#   circle square triangle).
#
# ---- THE CATEGORY BAR (92) ---------------------------------------------------------------------------
#   category_font                ripps2 (default), theme (font2 for the current tab, font7 the others)
#   category_layout              115: where LAUNCH DISC, STORAGE and MEMORY FILES go. A theme says row or
#                                sidebar to have them; unset is menu, as a theme made for OPL has it:
#                                row      their names across the top, centred at x 128, 320 and 512 (192
#                                         apart; a name wider than 184 is drawn at 15, 13 or 12 px), on y 30
#                                         (category_y moves the line), the PS2 mark under the lit one at y 53
#                                         (96 x 20): keep the theme's own top edge below y 70
#                                sidebar  glyphs down a bar on the left: the bar at sidebar_x (0), sidebar_width
#                                         wide (26), the whole height, its accent strip 14 more; the glyphs
#                                         sidebar_width - 8 (14 to 28) square, the middle one at y 240, a glyph
#                                         and 22 px apart; the drawer opens out to sidebar_drawer (216) in 26 px
#                                         rows: keep the theme's own left edge right of x 40
#                                menu     no bar: Storage alone, Launch Disc and Memory Files in the START menu,
#                                         L1 / R1 turning the list's pages
#                                column is sidebar (113). Layout > Category Layout overrides it. Build 113's
#                                categories=three / storage still reads as row / menu where this is unset
#   sidebar_x, sidebar_width     113: the bar the glyphs sit in (0, 26: Adapt's main2; 0..560, 16..80)
#   sidebar_drawer               113: the drawer's right edge (216; 120..400)
#   sidebar_bar                  113: always (RIPPS2 draws the bar on every page), pages (not on Storage, where
#                                the theme draws its own), never
#   sidebar_color, sidebar_tint  113: the bar's glass (#01040F, 88 of 128)
#   sidebar_accent_color, sidebar_accent_tint    113: the strip beside it (#28C5F9, 22; tint 0: none)
#   sidebar_style                115: split (default: the glyphs in the dark bar, the strip beside it), one_piece
#                                (one bar of the same overall width, the glyphs in its middle)
#   sidebar_left                 115: sidebar (default: Left on the list goes to the sidebar), list (Left / Right
#                                and L1 / R1 stay the list's, as RIPFLOW keeps its covers on them)
#   sidebar_hide                 115: 1: the sidebar stays out of sight until Circle brings out its icons
#   flowtilt                     117: 1: a coverflow theme's Up / Down (and the left stick) tip the centre case back
#                                and forth instead of changing the source, the categories as the sidebar (its drawer
#                                has the sources: Circle). RIPFLOW sets it
#   info_sidebar                 119: 1: the sidebar drawn on the info page all the time; 0 (default): out of sight there
#                                until Left brings it out (Circle or Right put it away, the page staying; Up / Down step
#                                the games; Circle with it away back to the list). No built-in theme sets 1; Adapt and Adapt Rx do
#   category_x, category_y       a column's left edge and first line (40, 140); in a row, y moves the bar
#   category_spacing             12..120 (34): a column's pitch
#   category_label_launch / category_label_storage / category_label_files    the words on the bar
#   category_transition          none fade flash: how a new tab's page comes in
#
# ---- THE LAUNCH DISC (91) ----------------------------------------------------------------------------
#   launch_disc       pop spin zoom off: the game's disc comes in as it launches (its ICO art, else launch_disc.png);
#                     zoom (RIPPS2 build 122) grows it to read clearly and holds; no key: pop
#
# ---- FONTS -------------------------------------------------------------------------------------------
#   builtin: ripps2 (RIPPS2's text face), ripps2sleek, ripps2sleekbold, ripps2sleekcase (true lowercase),
#   ripflow (Roboto Condensed), ripflowbold (Roboto Bold Condensed), roboto (114, variable), ripps2condensed
#   (115, Planet N Condensed). Nothing to ship for these.
#   Slots RIPPS2's own pages draw with: font2 the current tab, font3 Launch Disc's line, font4 the menus
#   (message boxes from 115: message_font), font5 small text, font6 text beside a glyph, font7 the other tabs, font8 Memory
#   Files rows, font9 true-case titles, font10 About's small print, font11 the CD player's title, font14
#   big numbers (RIPPS2 Sleek Bold 64 when unset), font15 typed text. A slot left out uses default_font.
#   From build 96 Settings and its dialogs read in one plain face (Roboto Condensed) on every theme.
#
# ---- ELEMENT TYPES (type=) ---------------------------------------------------------------------------
#   Background        full-screen art (pattern=BG) or a default= image          OPL
#   StaticImage       a fixed image (default=)                                   OPL
#   StaticText        fixed text (value=)                                        OPL
#   AttributeText     a game's metadata text (attribute=)                        OPL
#   AttributeImage    a badge picked by a game's metadata (attribute=)           OPL
#   GameImage         a game's art (pattern=), default= when it has none         OPL
#   GameCountText     how many items the list has                                OPL
#   MenuIcon          the page's device icon                                     OPL
#   MenuText          the page's name                                            OPL
#   ItemsList         the game list (added for you if left out)                  OPL
#   ItemIcon          the chosen game's disc art (ICO)                           OPL
#   ItemCover         the chosen game's cover, with an overlay                   OPL
#   ItemText          the chosen game's startup file                             OPL
#   HintText          the list's button hints                                    OPL
#   InfoHintText      the info page's button hints                               OPL
#   LoadingIcon       the loading spinner                                        OPL
#   BdmIndex          the block-device mode marker                               OPL
#   Coverflow         a cover carousel (RIPFLOW)                                 RiptOPL
#   Ripps2PanelGlass  a glass panel: gradient, clear (tint=) or frosted (blur=1) 55 / 78 / 79
#   Grid              the list as pages of covers in rows                        78
#   A Grid or Coverflow page also declares an ItemsList with hidden=1.
#
# ---- KEYS ON ANY ELEMENT -----------------------------------------------------------------------------
#   type, x, y, width, height       OPL  where and how big (int, POS_MID, DIM_INF)
#   aligned                         OPL  0 top-left at x,y; 1 centred on x,y; 2 right-justified
#   scaled                          OPL  1: keeps its shape on 16:9 (covers, cases, screenshots)
#   color, font                     OPL  #RRGGBB; a font slot 0..15
#   enabled                         OPL  0: skip the element, keep the block
#   devices                         OPL  only on these pages: usb ilink mx4sio hdd_bd hdd eth smb mmce
#                                        udpbd udpfs app fav bdm (MenuIcon, ItemsList, HintText)
#   tilt, tilt_x, tilt_y, tilt_scale 70  1: tips with the right stick; the pivot (elements sharing one
#                                        tip as one sheet); the angle, 1..400 percent
#
# ---- IMAGE KEYS --------------------------------------------------------------------------------------
#   default         OPL  the image: a file in the folder or a built-in name (cover, disc, screen, case...)
#   pattern         OPL  the game art: COV COV2 BG SCR SCR2 ICO LGO ... (ART/<id>_<pattern>.png or .jpg)
#                   108  SCRn: GameImage, every shot in turn (_SCR, _SCR2 .. _SCR9, 5 s each); a second SCRn box
#                        starts one shot later, so two never show the same one; as a slide, the next shot
#                        each time the show comes round
#   count           OPL  cache slots for the pattern (2 or more for COV)
#   overlay, overlay2                                     OPL  a frame over the art, and a second over it
#   overlay_ulx _uly _urx _ury _llx _lly _lrx _lry        OPL  the art's four corners inside the overlay
#   reflection, reflection_offset                         OPL  a fading mirror below; how far down
#   alpha           66   GameImage: opacity 0..128
#   slide           59   GameImage: slideshow place 1..4 (5 s each, 1 s crossfade)
#   widecrop        79   Background: 1 zooms 4:3 art on 16:9 instead of stretching it
#   valign          102  GameImage: bottom stands the art's lowest visible row on its box's bottom (logos)
#
# ---- TEXT KEYS ---------------------------------------------------------------------------------------
#   value           OPL  StaticText's words
#   attribute       OPL  AttributeText: Title Developer Description Genre Release #Size
#                        AttributeImage: Rating Players Scan Vmode Aspect Parental #System #Media
#                        #Format #DiscType (a theme file is <value>_<attribute>.png)
#   display         OPL  0 label and value, 1 only when there is a value, 2 the value alone
#   wrap            OPL  1: word wrap inside width / height
#   title           OPL  AttributeText: its own label
#   show_run        OPL  InfoHintText: 0 hides the Run hint
#   line_height, vcenter  59  wrapped text's line step; centre the block. Either one makes long text roll
#
# ---- LIST KEYS ---------------------------------------------------------------------------------------
#   decorator       OPL  ItemsList: a pattern drawn as each row's icon (ICO)
#   item_height     59   ItemsList: the row pitch
#   hidden          OPL  ItemsList: 1 drives the selection without drawing (Grid, Coverflow)
#   star            106  ItemsList: a starred game's star. left (the default): its own column at the start of every
#                        row; right: after the title; hidden: none. Settings > Game Sources > Starred Games Star wins
#   star_image      106  ItemsList: the star's picture (else the theme's fav_mark.png, else RIPPS2's)
#   highlight       106  ItemsList: the selected row: bar (the default), line (a line under the row), none
#   decorator_all   106  ItemsList: one picture as every row's icon
#   decorator_ps2, decorator_ps1, decorator_app  106  ItemsList: a row icon for each kind of row. A game's own icon
#                        (decorator=ICO) comes first, then its kind's, then decorator_all. With the star on the left
#                        the row icon moves to the row's right end, so the two never overlap
#
# ---- Ripps2PanelGlass --------------------------------------------------------------------------------
#   blur            78   1: frosted, the page's Background softened behind it
#   tint            79   0..128: one even tint (clear glass) instead of the gradient
#   tint_color      79   #RRGGBB (#040C2E): the tint's colour
#   frame           79   0: no frame line. The first framed panel of main and of info morph into each other
#
# ---- Grid --------------------------------------------------------------------------------------------
#   x, y, width, height   the grid's centre (POS_MID), its top (60), one cover (104 x 146)
#   columns 1..8 (4), rows 1..4 (2), spacing (14)          78
#   back_pattern          82   the back of a turned case (COV2); 0: cases do not turn
#   coverless             92   title (default), serial: what a game with no cover shows on its case
#   title, title_y, title_font   92   1: the chosen game's name under the grid; its line (418); its font
#   wide_columns, wide_rows, wide_width, wide_height, wide_spacing   98   the page on a 16:9 picture only
#                         (widescreen, 720p, 1080i); each one left out is the standard one
#   overlay, overlay_*, reflection, font, tilt*: as above (tilt tips only the chosen cover)
#   On the console: Right on a row's last cover and L2 / R2 turn the page (97, 98); a 0.42 s hold turns the
#   chosen case over (97, RIPFLOW's centre cover too); Circle cycles the sources.
#
# ---- RIPPS2'S OWN IMAGES, REPLACED BY NAME (ship <name>.png, 8-bit palette) ---------------------------
#   115: an image a theme names (default=, overlay=, overlay2=, a badge folder's rating/0_Rating) but leaves
#   out is RIPPS2's own of that name, unless use_default=0: a theme can be conf_theme.cfg and its own pictures
#   glyphs: cross circle square triangle select start L1 R1 L3 R3 L2R2 left right ripps2_up ripps2_down
#           hint_badge     loading: load0 ... load7 (not drawn: RIPPS2's busy mark is)     launch: launch_disc
#   devices: usb usb_bd ilk_bd m4s_bd hdd_bd hdd mmce eth udp_bd udp_fs app Index_0 ... Index_4
#   badges: ELF HDL ISO VCD ZSO UL APP CD DVD PS1 PS2, Aspect_*, Rating_*, Scan_*, Vmode_*; 115: Players_1..4,
#           Parental_3 _10 _17 _18 _e _teen
#   art: cover disc screen screens coverapp missing case case_overlay apps_case logo logo0 ... logo6 fav
#        fav_mark settings_bg     marks: ripps2_mark ripps2_mark_glow ripps2_glass ripps2_ps1logo
#        ripps2_ps2logo ripps2_grid_icons ra_mark
#
# ---- SOUND -------------------------------------------------------------------------------------------
#   sound/<event>.adp: boot cursor confirm cancel message transition bd_connect bd_disconnect page_in
#   page_out error save launch disc random. sound/bgm.ogg: the theme's music. RIPPS2 has no sounds of
#   its own (build 95); from build 98 an event the theme leaves out plays the user's AUDIO folder sound,
#   from build 100 only when nothing in the theme's set covers it. Adapt and Adapt Rx ship no sounds.
#   sounds            102  audio: always the AUDIO folder's sounds (the user's rips), never a sound folder
#                          in the theme (one an older edition left behind is passed over)
#   An app's case is a PS1 square unless its menu (Triangle > Case Shape) says PS2 or Theme (102); a PS1 game's
#   cover is in the square case too, on every theme (115).
# ======================================================================================================
#
# RIPPS2: the categories in the START menu (RiptOPL has no category bar)
category_layout=menu
#
# ---- RiptOPL's layout, as RiptOPL embeds it --------------------------------------
# Korium Komblete -- graphics by Berion, script by KrahJohlito and Ripto.
# Ported to the built-in theme by RiptOPL.
#
# THIS IS KORIUM'S OWN CFG, element for element and number for number. It wrote positions as
# negative offsets, which the parser folds as x plus 640 and y plus 480, and most elements default
# to centre alignment -- so the literals below are the theme's own layout, kept as written.
#
# EXACTLY THREE THINGS DIFFER from it, each marked in place -- the MenuIcon and BdmIndex sizes,
# because their bitmaps changed size under the cfg, and the ItemCover overlay corners, because
# Korium's were authored against its own older case art and no longer match the delivered frames.
#
# NO GLOBAL COLOUR KEYS. The built-in themes take their colours from the Colours picker
# (thmLoad in src/themes.c, #574) -- a bg_color / text_color / sel_text_color here would override
# the user's own choice on every boot. Korium set text_color to white globally; the info page
# below keeps that as a per-element colour, which is also what the previous built-in did.
#
# NO default_font either. The built-in theme has no folder to load a TTF from, so the embedded
# PoeVeticaNew is already slot 0.
#
# Element names are scanned consecutively from 0 and a NUMBERING GAP SILENTLY STOPS THE SCAN --
# addGUIElem returns 0 only when <name>_type is absent, which ends the while loop in thmLoad and
# silently discards every later index. To switch an element off, set its enabled key to 0.
#
# Careful with comment lines. This format has no comment character -- a line containing a colon
# and no equals sign parses as a SECTION HEADER and re-homes every key under it. So comment text
# must avoid both characters.
# Per-game background art behind the list, gated by the Background Art toggle (gEnableBGArt).
#
# Two layers, the same way the original built-in theme and Korium's own "game background version"
# recipe both did it. main0 draws the game's ART/<id>_BG.png; main1 lays a translucent plate over it
# so the list stays legible. The delivered background.png is used for BOTH, with a uniform alpha of
# 204 -- about 80 percent, the value the original incebtion.png and the delivered background_info
# plate both use. One asset instead of a second 134 KB copy.
#
#   art present   main0 draws the art, main1 tints it charcoal -- the game reads through at 20 percent
#   no art        main0 falls to its default -- the same charcoal -- over the black frame clear, and
#                 main1 lands on top, so it is indistinguishable from a plain opaque background
#   toggle OFF    getGameImageTextureEx returns NULL for the BG cache BEFORE any request is made, so
#                 there is no I/O at all -- this is the setting to reach for if browsing feels slow
#
# Korium's recipe had two faults, corrected here. It set default to BG, but BG is a PATTERN, not an
# image name, so it would never have loaded game art. And background_transparent was not shipped.
main0:
	type=Background
	pattern=BG
	default=background
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF
main1:
	type=StaticImage
	default=background
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF
# Korium's position and full 306 height. Korium's decorator of ICO is REMOVED on purpose -- it
# drew a per-row icon, turning every settled row into an art lookup, and the selected-item disc
# below already gives that look for one cache slot.
main2:
	type=ItemsList
	x=40
	y=38
	width=400
	height=306
# SIZE ONLY. Korium declared just width and height here and let a MenuIcon's default centre of
# (320, 400) place it, so the bar has always floated at the bottom. That is kept exactly -- no x,
# no y, no aligned. Only the forced dimensions grow, because the strip is now a 640 by 128 bitmap
# per device with that device's tab lit where Korium's was 256 by 64; 480 by 96 holds the art's
# 5 to 1 aspect and still ends at 448, leaving the hint on its own default row underneath.
# One UNFILTERED element is the whole bar, exactly as Korium had it -- drawMenuIcon draws the
# texture for the current page's icon_id.
#
# The strip reads BDM, MMCE, APA, NET, APPS, FAV left to right, and initAllSupport in src/opl.c
# initialises the pages in that same order (menuAppendItem links each page at the tail, so call
# order IS tab order). Change one and you must change the other or the wrong tab lights up.
main3:
	type=MenuIcon
	width=480
	height=96
# Korium's covers -- same element, same position, and NO overlay2 (the case art carries its own
# gloss in the face alpha; layering case_overlay over it greys the face and fringes the spine).
#
# THE CORNERS ARE MEASURED, NOT KORIUM'S, and that is deliberate. They are not proportional to the
# element -- rmDrawOverlayPixmap adds them to the quad's top-left in SCREEN space and drawGameImage
# passes them unscaled -- so they only line up if they match the delivered bitmap exactly. Korium's
# were authored against its own older case art and sat 3 px high, running the artwork past the
# case's bottom lip. Re-measure these against the PNG if the art is ever redrawn.
main4:
	type=ItemCover
	default=cover
	x=-86
	y=-296
	overlay=case
	overlay_ulx=0
	overlay_uly=12
	overlay_urx=167
	overlay_ury=20
	overlay_llx=0
	overlay_lly=242
	overlay_lrx=167
	overlay_lry=250
appsMain4:
	type=ItemCover
	default=cover
	x=-86
	y=-254
	overlay=apps_case
	overlay_ulx=0
	overlay_uly=12
	overlay_urx=167
	overlay_ury=20
	overlay_llx=0
	overlay_lly=167
	overlay_lrx=167
	overlay_lry=175
# NEW, because Korium predates this fork's VCD family. PS1 titles get the jewel case; the corners
# are measured off case_ps1.png the same way Korium's were off its own case art.
vcdMain4:
	type=ItemCover
	default=cover
	x=-86
	y=-246
	overlay=case_ps1
	overlay_ulx=17
	overlay_uly=11
	overlay_urx=155
	overlay_ury=17
	overlay_llx=17
	overlay_lly=144
	overlay_lrx=155
	overlay_lry=150
main5:
	type=ItemIcon
	default=disc
	x=-220
	y=-230
	width=128
	height=128
vcdMain5:
	type=ItemIcon
	default=disc_ps1
	x=-220
	y=-230
	width=128
	height=128
# Korium hid the disc on the apps page by giving it zero size; enabled of 0 is the supported way.
appsMain5:
	enabled=0
	type=ItemIcon
main6:
	type=ItemText
	x=-124
	y=-155
